spring:
  application:
    name: asistencia-api
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:sistema_asistencia}?serverTimezone=UTC}"
    username: "${DB_USER:asistencia_app}"
    password: "${DB_PASSWORD}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  time-zone: "${APP_TIME_ZONE:America/Lima}"
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  attendance:
    entry-tolerance-minutes: ${ATTENDANCE_ENTRY_TOLERANCE_MINUTES:0}
    exit-tolerance-minutes: ${ATTENDANCE_EXIT_TOLERANCE_MINUTES:0}
    entry-open-before-minutes: ${ATTENDANCE_ENTRY_OPEN_BEFORE_MINUTES:60}
    entry-close-after-minutes: ${ATTENDANCE_ENTRY_CLOSE_AFTER_MINUTES:120}
    exit-close-after-minutes: ${ATTENDANCE_EXIT_CLOSE_AFTER_MINUTES:180}
    max-location-accuracy-meters: ${ATTENDANCE_MAX_LOCATION_ACCURACY_METERS:100}
  security:
    jwt:
      issuer: ${JWT_ISSUER:asistencia-api}
      secret: ${JWT_SECRET}
      access-token-minutes: ${JWT_ACCESS_MINUTES:15}
  bootstrap-admin:
    username: "${APP_BOOTSTRAP_ADMIN_USERNAME:}"
    password: "${APP_BOOTSTRAP_ADMIN_PASSWORD:}"
    reset-existing: ${APP_BOOTSTRAP_ADMIN_RESET:false}
